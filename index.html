<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Subway 360</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
    }
    #gameover {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff3333;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">Score: <span id="scoreVal">0</span></div>
  <div id="gameover">GAME OVER<br><span style="font-size:16px; color:#fff;">Tap to Restart</span></div>

  <script>
    let scene, camera, renderer, player;
    let lanes = [-2.5, 0, 2.5];
    let currentLane = 1;
    let jumping = false;
    let jumpVelocity = 0;
    const gravity = 0.015;
    let obstacles = [];
    let speed = 0.35;
    let score = 0;
    let isGameOver = false;

    let touchStartX = 0;
    let touchStartY = 0;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 20, 60);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 4, 7);
      camera.lookAt(0, 1, -2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 15, 10);
      scene.add(dirLight);

      const groundGeo = new THREE.PlaneGeometry(10, 200);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.z = -50;
      scene.add(ground);

      for (let i = -1; i <= 1; i += 2) {
        const lineGeo = new THREE.PlaneGeometry(0.15, 200);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(i * 1.25, 0.01, -50);
        scene.add(line);
      }

      const playerGeo = new THREE.BoxGeometry(1, 1.6, 0.8);
      const playerMat = new THREE.MeshLambertMaterial({ color: 0x00ff88 });
      player = new THREE.Mesh(playerGeo, playerMat);
      player.position.set(lanes[currentLane], 0.8, 0);
      scene.add(player);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('touchstart', onTouchStart, { passive: true });
      window.addEventListener('touchend', onTouchEnd, { passive: true });
      window.addEventListener('keydown', onKeyDown);
    }

    function spawnObstacle() {
      const obsGeo = new THREE.BoxGeometry(1.2, 1.2, 1);
      const obsMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
      const obstacle = new THREE.Mesh(obsGeo, obsMat);
      
      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      obstacle.position.set(randomLane, 0.6, -60);
      scene.add(obstacle);
      obstacles.push(obstacle);
    }

    let spawnTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      if (isGameOver) return;

      if (jumping) {
        player.position.y += jumpVelocity;
        jumpVelocity -= gravity;
        if (player.position.y <= 0.8) {
          player.position.y = 0.8;
          jumping = false;
        }
      }

      const targetX = lanes[currentLane];
      player.position.x += (targetX - player.position.x) * 0.2;

      spawnTimer++;
      if (spawnTimer > 45) {
        spawnObstacle();
        spawnTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += speed;

        const pBox = new THREE.Box3().setFromObject(player);
        const oBox = new THREE.Box3().setFromObject(obs);

        if (pBox.intersectsBox(oBox)) {
          triggerGameOver();
        }

        if (obs.position.z > 8) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          score += 10;
          document.getElementById('scoreVal').innerText = score;
        }
      }

      speed += 0.00005;

      renderer.render(scene, camera);
    }

    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('gameover').style.display = 'block';
    }

    function resetGame() {
      for (let obs of obstacles) scene.remove(obs);
      obstacles = [];
      score = 0;
      speed = 0.35;
      currentLane = 1;
      player.position.set(0, 0.8, 0);
      jumping = false;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('gameover').style.display = 'none';
      isGameOver = false;
    }

    function onTouchStart(e) {
      if (isGameOver) {
        resetGame();
        return;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }

    function onTouchEnd(e) {
      if (isGameOver) return;
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX > 40 && currentLane < 2) currentLane++;
        else if (deltaX < -40 && currentLane > 0) currentLane--;
      } else {
        if (deltaY < -40 && !jumping) {
          jumping = true;
          jumpVelocity = 0.26;
        }
      }
    }

    function onKeyDown(e) {
      if (isGameOver) { resetGame(); return; }
      if (e.key === 'ArrowLeft' && currentLane > 0) currentLane--;
      if (e.key === 'ArrowRight' && currentLane < 2) currentLane++;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !jumping) {
        jumping = true;
        jumpVelocity = 0.26;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
